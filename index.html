<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Activated Tasbih Counter</title>
    <style>
        :root {
            --primary-color: #38a169;
            --secondary-color: #2f855a;
            --accent-color: #68d391;
            --text-color: #f7fafc;
            --bg-color: #1a202c;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: background-color 0.3s;
        }
        
        .container {
            width: 90%;
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 1rem;
            background-color: rgba(26, 32, 44, 0.9);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            font-weight: 600;
        }
        
        .zikr-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            border: 2px solid var(--secondary-color);
            border-radius: 0.5rem;
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            margin-bottom: 1.5rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .zikr-input:focus {
            border-color: var(--accent-color);
        }
        
        .zikr-display {
            font-size: 2rem;
            margin: 1.5rem 0;
            min-height: 3rem;
            color: var(--accent-color);
            font-weight: bold;
            word-break: break-word;
        }
        
        .counter {
            font-size: 5rem;
            font-weight: bold;
            margin: 1.5rem 0;
            color: var(--text-color);
            transition: transform 0.2s;
        }
        
        .counter.active {
            transform: scale(1.1);
            color: var(--accent-color);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        button {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .mic-btn {
            background-color: var(--primary-color);
            color: white;
        }
        
        .mic-btn:hover {
            background-color: var(--secondary-color);
        }
        
        .mic-btn.active {
            background-color: #e53e3e;
            animation: pulse 1.5s infinite;
        }
        
        .reset-btn {
            background-color: #4a5568;
            color: white;
        }
        
        .reset-btn:hover {
            background-color: #2d3748;
        }
        
        .status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #a0aec0;
            min-height: 1.5rem;
        }
        
        .visual-feedback {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgba(56, 161, 105, 0.1);
            margin: 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s;
        }
        
        .visual-feedback::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background-color: rgba(56, 161, 105, 0.2);
            transition: all 0.3s;
        }
        
        .visual-feedback.active {
            background-color: rgba(56, 161, 105, 0.3);
        }
        
        .visual-feedback.active::after {
            background-color: rgba(56, 161, 105, 0.5);
            transform: scale(1.2);
        }
        
        .mic-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            .zikr-display {
                font-size: 1.5rem;
            }
            
            .counter {
                font-size: 4rem;
            }
            
            .controls {
                flex-direction: column;
                gap: 0.75rem;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voice-Activated Tasbih</h1>
        
        <input type="text" class="zikr-input" placeholder="Enter your zikr (e.g. Subhanallah)" value="Subhanallah">
        
        <div class="zikr-display">Subhanallah</div>
        
        <div class="visual-feedback">
            <div class="counter">0</div>
        </div>
        
        <div class="status">Click the microphone button to start</div>
        
        <div class="controls">
            <button class="mic-btn" id="micButton">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z" />
                </svg>
                Start
            </button>
            <button class="reset-btn" id="resetButton">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12,5V1L7,6L12,11V7A6,6 0 0,1 18,13A6,6 0 0,1 12,19A6,6 0 0,1 6,13H4A8,8 0 0,0 12,21A8,8 0 0,0 20,13A8,8 0 0,0 12,5Z" />
                </svg>
                Reset
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const zikrInput = document.querySelector('.zikr-input');
            const zikrDisplay = document.querySelector('.zikr-display');
            const counterElement = document.querySelector('.counter');
            const micButton = document.getElementById('micButton');
            const resetButton = document.getElementById('resetButton');
            const statusElement = document.querySelector('.status');
            const visualFeedback = document.querySelector('.visual-feedback');
            
            let count = 0;
            let isListening = false;
            let audioContext;
            let analyser;
            let microphone;
            let scriptProcessor;
            let silenceTimer;
            let wasSpeaking = false;
            
            // Update zikr display when input changes
            zikrInput.addEventListener('input', () => {
                zikrDisplay.textContent = zikrInput.value || 'Subhanallah';
            });
            
            // Initialize audio context on user interaction
            function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512;
                    scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
                    
                    scriptProcessor.onaudioprocess = processAudio;
                }
            }
            
            // Process audio to detect speech
            function processAudio() {
                const array = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(array);
                
                let sum = 0;
                for (let i = 0; i < array.length; i++) {
                    sum += array[i];
                }
                
                const average = sum / array.length;
                const isSpeaking = average > 10; // Threshold for voice detection
                
                if (isSpeaking) {
                    if (!wasSpeaking) {
                        // Speech started
                        wasSpeaking = true;
                        visualFeedback.classList.add('active');
                        counterElement.classList.add('active');
                        clearTimeout(silenceTimer);
                    }
                } else {
                    if (wasSpeaking) {
                        // Speech ended
                        wasSpeaking = false;
                        visualFeedback.classList.remove('active');
                        counterElement.classList.remove('active');
                        
                        // Count after a brief silence
                        silenceTimer = setTimeout(() => {
                            count++;
                            counterElement.textContent = count;
                        }, 300);
                    }
                }
            }
            
            // Start/stop microphone
            micButton.addEventListener('click', async () => {
                if (!isListening) {
                    try {
                        initAudio();
                        
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        microphone = audioContext.createMediaStreamSource(stream);
                        microphone.connect(analyser);
                        analyser.connect(scriptProcessor);
                        scriptProcessor.connect(audioContext.destination);
                        
                        isListening = true;
                        micButton.classList.add('active');
                        micButton.innerHTML = `
                            <svg class="mic-icon" viewBox="0 0 24 24">
                                <path d="M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z" />
                            </svg>
                            Stop
                        `;
                        statusElement.textContent = 'Listening for zikr... Speak clearly';
                    } catch (error) {
                        console.error('Error accessing microphone:', error);
                        statusElement.textContent = 'Microphone access denied. Please allow microphone access.';
                    }
                } else {
                    stopListening();
                    micButton.classList.remove('active');
                    micButton.innerHTML = `
                        <svg class="mic-icon" viewBox="0 0 24 24">
                            <path d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z" />
                        </svg>
                        Start
                    `;
                    statusElement.textContent = 'Microphone stopped. Click to start again.';
                }
            });
            
            // Stop microphone and clean up
            function stopListening() {
                if (microphone) {
                    microphone.disconnect();
                }
                if (scriptProcessor) {
                    scriptProcessor.disconnect();
                }
                if (analyser) {
                    analyser.disconnect();
                }
                
                isListening = false;
                wasSpeaking = false;
                clearTimeout(silenceTimer);
                visualFeedback.classList.remove('active');
                counterElement.classList.remove('active');
            }
            
            // Reset counter
            resetButton.addEventListener('click', () => {
                count = 0;
                counterElement.textContent = count;
                counterElement.classList.remove('active');
                statusElement.textContent = isListening ? 'Listening for zikr... Speak clearly' : 'Counter reset';
            });
            
            // Clean up when page is closed
            window.addEventListener('beforeunload', () => {
                stopListening();
            });
        });
    </script>
</body>
</html>
